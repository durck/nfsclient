# Disposable GlusterFS file-layout fixture, on an isolated container network.
NFS_Core_Param {
 Protocols = 4;
 NFS_Port = 2049;
 Enable_NLM = false;
 Enable_RQUOTA = false;
}
NFSV4 {
 Minor_Versions = 1, 2;
 Lease_Lifetime = 30;
 Grace_Period = 10;
}
NFS_KRB5 { Active_krb5 = false; }
GLUSTER { PNFS_MDS = true; PNFS_DS = true; }
EXPORT {
 Export_Id = 77;
 Path = /;
 Pseudo = /data;
 Access_Type = RW;
 Squash = No_Root_Squash;
 SecType = sys;
 Protocols = 4;
 Transports = TCP;
 FSAL { Name = GLUSTER; Hostname = localhost; Volume = nvdata; enable_upcall = true; }
}
LOG { Default_Log_Level = EVENT; Components { PNFS = DEBUG; } }
