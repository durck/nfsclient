# Disposable synthetic storage only. Publish ports on loopback, never publicly.
NFS_Core_Param {
    Protocols = 3, 4;
    NFS_Port = 2049;
    MNT_Port = 20048;
    Enable_NLM = false;
    Enable_RQUOTA = false;
}
NFSV4 {
    Minor_Versions = 0, 1, 2;
    Lease_Lifetime = 6;
    Grace_Period = 6;
}
EXPORT {
    Export_Id = 1;
    Path = /data;
    Pseudo = /data;
    Access_Type = RW;
    Squash = No_Root_Squash;
    SecType = sys;
    Protocols = 3, 4;
    Transports = TCP, UDP;
    FSAL { Name = MEM; }
}
LOG { Default_Log_Level = WARN; }
# MEM otherwise acknowledges writes but synthesizes read data; retain bytes
# for the round-trip fixture (all test files are smaller than this limit).
MEM { Inode_Size = 1114112; }
