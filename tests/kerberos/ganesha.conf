# Local synthetic fixture: exports require explicit Kerberos authentication.
NFS_Core_Param {
 Protocols = 3, 4;
 NFS_Port = 2049;
 MNT_Port = 20048;
 Enable_NLM = false;
 Enable_RQUOTA = false;
}
NFSV4 {
 Minor_Versions = 0, 1, 2;
 Lease_Lifetime = 6;
 Grace_Period = 6;
}
NFS_KRB5 {
 PrincipalName = "nfs";
 KeytabPath = "/etc/krb5.keytab";
 Active_krb5 = true;
}
EXPORT {
 Export_Id = 1;
 Path = /data;
 Pseudo = /data;
 Access_Type = RW;
 Squash = No_Root_Squash;
 SecType = krb5, krb5i, krb5p;
 Protocols = 3, 4;
 Transports = TCP, UDP;
 FSAL { Name = MEM; }
}
LOG { Default_Log_Level = WARN; }
EXPORT {
 Export_Id = 2;
 Path = /integrity;
 Pseudo = /integrity;
 Access_Type = RW;
 Squash = No_Root_Squash;
 SecType = krb5i;
 Protocols = 3, 4;
 Transports = TCP, UDP;
 FSAL { Name = MEM; }
}
MEM { Inode_Size = 1114112; }

EXPORT {
 Export_Id = 3;
 Path = /private;
 Pseudo = /private;
 Access_Type = RW;
 Squash = No_Root_Squash;
