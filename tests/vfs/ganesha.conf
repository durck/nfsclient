# Disposable POSIX-backed fixture. KDC/user setup comes from the chosen base.
NFS_Core_Param {
 Protocols = 3, 4;
 NFS_Port = 2049;
 MNT_Port = 20048;
 Enable_NLM = false;
 Enable_RQUOTA = false;
}
NFSV4 {
 Minor_Versions = 0, 1, 2;
 Lease_Lifetime = 6;
 Grace_Period = 6;
}
NFS_KRB5 {
 PrincipalName = "nfs";
 KeytabPath = "/etc/krb5.keytab";
 Active_krb5 = true;
}
EXPORT {
 Export_Id = 1;
 Path = /data;
 Pseudo = /data;
 Access_Type = RW;
 Squash = No_Root_Squash;
 SecType = sys, krb5, krb5i, krb5p;
 Protocols = 3, 4;
 Transports = TCP, UDP;
 Manage_Gids = false;
 FSAL { Name = VFS; }
}
EXPORT {
 Export_Id = 2;
 Path = /squashed;
 Pseudo = /squashed;
 Access_Type = RW;
 Squash = Root_Squash;
 Anonymous_uid = 65534;
 Anonymous_gid = 65534;
 SecType = sys, krb5, krb5i, krb5p;
 Protocols = 3, 4;
 Transports = TCP, UDP;
 Manage_Gids = false;
 FSAL { Name = VFS; }
}
LOG { Default_Log_Level = WARN; }
